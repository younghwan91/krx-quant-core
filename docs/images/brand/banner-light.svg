<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <defs>
    <linearGradient id="kqc-banner-bg-l" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <radialGradient id="kqc-glow-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(975 140) rotate(90) scale(160 240)">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kqc-mark-bg-l" x1="56" y1="48" x2="120" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="kqc-core-l" x1="934" y1="98" x2="1018" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="kqc-dots-l" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Card Container -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#kqc-banner-bg-l)" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="740" y="16" width="444" height="248" rx="14" fill="url(#kqc-dots-l)" opacity="0.7"/>
  <rect x="720" y="2" width="478" height="276" rx="18" fill="url(#kqc-glow-l)"/>

  <!-- Left: Brand Mark (64x64) -->
  <rect x="56" y="48" width="64" height="64" rx="14" fill="url(#kqc-mark-bg-l)"/>
  <rect x="57" y="49" width="62" height="62" rx="13" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.5"/>
  <polygon points="88,60 105,70 105,90 88,100 71,90 71,70" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" fill="#FFFFFF" fill-opacity="0.08"/>
  <path d="M88 60V100M71 70L105 90M105 70L71 90" stroke="#C4B5FD" stroke-opacity="0.55" stroke-width="1.3"/>
  <polygon points="88,70 96.5,75 96.5,85 88,90 79.5,85 79.5,75" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="88" cy="80" r="3.6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Left: Title & Tagline & Tech Pills -->
  <text x="138" y="88" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.025em">krx-quant-core</text>
  <text x="139" y="110" fill="#6D28D9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em">KOREAN EQUITY QUANT CORE</text>

  <text x="56" y="156" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19.5" font-weight="500">Asymmetric price limits, dated transaction taxes &amp; one-shot OOS ledger.</text>

  <rect x="56" y="192" width="116" height="32" rx="16" fill="#4338CA"/>
  <circle cx="74" cy="208" r="4" fill="#38BDF8"/>
  <text x="86" y="213" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Python 3.11+</text>

  <rect x="184" y="192" width="142" height="32" rx="16" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2"/>
  <text x="202" y="213" fill="#5B21B6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KRX Market Rules</text>

  <rect x="338" y="192" width="112" height="32" rx="16" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
  <text x="356" y="213" fill="#0369A1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Apache-2.0</text>

  <!-- Right: Hex-Grid Core Artwork -->
  <!-- Outer satellite hexes -->
  <polygon points="976,34 1000,48 1000,76 976,90 952,76 952,48" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <polygon points="976,190 1000,204 1000,232 976,246 952,232 952,204" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <polygon points="908,73 932,87 932,115 908,129 884,115 884,87" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <polygon points="908,151 932,165 932,193 908,207 884,193 884,165" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <polygon points="1044,73 1068,87 1068,115 1044,129 1020,115 1020,87" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <polygon points="1044,151 1068,165 1068,193 1044,207 1020,193 1020,165" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>

  <!-- Outer far accent hexes -->
  <polygon points="840,112 864,126 864,154 840,168 816,154 816,126" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2"/>
  <polygon points="1112,112 1136,126 1136,154 1112,168 1088,154 1088,126" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2"/>

  <!-- Center Core Hexagon -->
  <polygon points="976,94 1016,117 1016,163 976,186 936,163 936,117" fill="url(#kqc-core-l)"/>
  <path d="M976 94V186M936 117L1016 163M1016 117L936 163" stroke="#C4B5FD" stroke-opacity="0.45" stroke-width="1.5"/>
  <polygon points="976,114 998.5,127 998.5,153 976,166 953.5,153 953.5,127" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="976" cy="140" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Satellite precision nodes -->
  <circle cx="976" cy="62" r="4" fill="#7C3AED"/>
  <circle cx="976" cy="218" r="4" fill="#7C3AED"/>
  <circle cx="908" cy="101" r="4" fill="#4338CA"/>
  <circle cx="908" cy="179" r="4" fill="#38BDF8"/>
  <circle cx="1044" cy="101" r="4" fill="#38BDF8"/>
  <circle cx="1044" cy="179" r="4" fill="#4338CA"/>
</svg>
